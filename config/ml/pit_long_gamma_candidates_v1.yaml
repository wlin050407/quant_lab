# ML-P7.6.2 long-gamma candidate discovery (max 30 dates, controlled ingest).
# No credentials. Requires local ThetaData entitlement for missing partitions.

version: pit-long-gamma-candidates-v1
root: SPXW
index_symbol: SPX
expiration_mode: same_day
strike_range: 60
strike_range_fallback: 30

anchor_type: regular_5min
anchor_start_offset_minutes: 5
anchor_end_offset_minutes: 5

session_rth_start: "09:30:00"
session_rth_end: "16:00:00"

outputs:
  raw_lake: artifacts/raw_lake_sample
  reports: artifacts/reports/pit_long_gamma_candidates_v1

lake_root: artifacts/raw_lake_sample
report_root: artifacts/reports/pit_long_gamma_candidates_v1

ingest:
  enabled: true
  max_dates: 30
  max_retries: 2
  request_budget_per_date: 10
  write_raw_lake: true
  idempotent_skip_existing: true
  full_rth: true

data:
  root: SPXW
  expiration: trade_date
  session: RTH
  strike_range: 60
  quote_resolution: tick_or_1s
  trade_resolution: tick
  greeks_resolution: 1m
  index_resolution: tick_or_1s
  oi: true

discovery:
  scan_anchor_times_normal: ["10:00:00", "11:00:00", "12:00:00", "13:00:00", "14:00:00", "15:00:00"]
  scan_anchor_times_early_close: ["10:00:00", "11:00:00", "12:00:00"]
  top_n: 10
  stage_a_plus_min_dates: 5
  stage_a_plus_max_dates: 10

dates:
  - date: "2024-01-05"
    day_type: normal
    note: stage_a_short_gamma
  - date: "2024-07-03"
    day_type: early_close
    note: stage_a_secondary_weak
  - date: "2025-04-04"
    day_type: monthly_opex
