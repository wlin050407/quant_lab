# ML-P7.6.2 Stage A+ long-gamma-aware sample (separate from Stage A v1).
# Dates populated from discovery ranking; shared raw lake with pit_sample_ingest_v1.

version: pit-sample-long-gamma-v1
root: SPXW
index_symbol: SPX
expiration_mode: same_day
strike_range: 60
strike_range_fallback: 30

anchor_type: regular_5min
anchor_start_offset_minutes: 5
anchor_end_offset_minutes: 5

session_rth_start: "09:30:00"
session_rth_end: "16:00:00"

outputs:
  raw_lake: artifacts/raw_lake_sample
  dataset: artifacts/datasets/pit_sample_long_gamma_v1
  features: artifacts/features/pit_sample_long_gamma_v1
  reports: artifacts/reports/pit_sample_long_gamma_v1

lake_root: artifacts/raw_lake_sample
dataset_root: artifacts/datasets/pit_sample_long_gamma_v1
feature_root: artifacts/features/pit_sample_long_gamma_v1
report_root: artifacts/reports/pit_sample_long_gamma_v1
joined_root: artifacts/datasets/pit_sample_long_gamma_v1/joined

ingest:
  enabled: true
  max_dates: 10
  max_retries: 2
  request_budget_per_date: 10
  write_raw_lake: true
  idempotent_skip_existing: true
  full_rth: true

data:
  root: SPXW
  expiration: trade_date
  session: RTH
  strike_range: 60
  quote_resolution: tick_or_1s
  trade_resolution: tick
  greeks_resolution: 1m
  index_resolution: tick_or_1s
  oi: true

anchors:
  type: regular_5min

