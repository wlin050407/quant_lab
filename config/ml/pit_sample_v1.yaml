# ML-P7.5 controlled point-in-time sample dataset (20 trading days, manual curation).
# No credentials. Dates must be strictly in the past relative to build time.

version: pit-sample-v1
root: SPXW
index_symbol: SPX
expiration_mode: same_day  # expiration = trade_date
strike_range: 60
strike_range_fallback: 30

anchor_type: regular_5min
anchor_start_offset_minutes: 5
anchor_end_offset_minutes: 5

session_rth_start: "09:30:00"
session_rth_end: "16:00:00"

lake_root: artifacts/raw_lake_sample
dataset_root: artifacts/datasets/pit_sample_v1
feature_root: artifacts/features/pit_sample_v1
report_root: artifacts/reports/pit_sample_v1
joined_root: artifacts/datasets/pit_sample_v1/joined

ingest:
  enabled: false  # set true only with local ThetaData entitlement
  full_rth: true

seed_from_pilot_lake: artifacts/raw_lake_pilot  # idempotent copy for pilot trade_date only

# Curated 20-session list covering diverse day types (manual classification).
dates:
